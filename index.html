<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kirpa Social Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FBF6F1; --surface:#FFFFFF; --surface-2:#FFFDFB;
    --ink:#2A2622; --muted:#8A817A; --line:#ECE3DA;
    --coral:#F0653A;                 /* brand + interactive ONLY */
    --green:#2E7D5B; --ochre:#C98A1B; --crimson:#B03A3A;  /* signal states */
    --shadow:0 1px 2px rgba(42,38,34,.04), 0 8px 24px rgba(42,38,34,.06);
    --r:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:Poppins,system-ui,sans-serif;font-size:15px;line-height:1.5;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  a{color:var(--coral);text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 20px 64px}

  /* header */
  .top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;
    padding-bottom:20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px}
  .spark{width:26px;height:26px;flex:0 0 auto}
  .brand h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em}
  .brand .sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:1px}
  .stamp{text-align:right;font-size:12px;color:var(--muted);line-height:1.45}
  .src{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:11px;
    padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
  .src.sample{background:#FBF0D9;color:var(--ochre)}
  .src.pending{background:#FBF0D9;color:var(--ochre)}
  .src.live{background:#E4F1EA;color:var(--green)}
  .setup{padding:22px;margin:16px 0}
  .setup h2{margin:8px 0 6px;font-size:18px;font-weight:700;letter-spacing:-.01em}
  .setup p{margin:0 0 14px;font-size:13.5px;color:var(--muted);max-width:60ch}
  .setup ol{margin:0;padding-left:20px;font-size:13.5px}
  .setup li{margin-bottom:7px}
  .setup code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;
    padding:1px 6px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .ready{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}
  .ready b{font-weight:600}
  .src .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* controls */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 8px}
  .pill{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    font:inherit;font-weight:500;font-size:13.5px;padding:7px 15px;border-radius:999px;cursor:pointer;
    transition:border-color .15s,color .15s}
  .pill:hover{border-color:var(--coral)}
  .pill[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff}
  .pill:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
  .hint{font-size:12px;color:var(--muted);margin-left:auto}

  /* hero */
  .hero{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin:16px 0 8px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .champ{padding:20px}
  .leads{display:flex;gap:14px;margin-top:14px}
  .lead{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:14px}
  .lead-k{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .lead-n{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;margin:6px 0 1px}
  .lead-v{font-size:14px;font-weight:600;color:var(--coral)}
  .lead-note{margin-top:14px;font-size:12px;color:var(--muted)}
  .ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 10px,#FBF4EE 10px,#FBF4EE 20px)}
  .ph svg{width:38px;height:38px}
  .ph span{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--coral)}
  .dstat{display:flex;gap:18px;margin-top:6px}
  .dstat b{display:block;font-size:19px;font-weight:700}
  .dstat span{font-size:11px;color:var(--muted)}
  .pthumb{width:56px;height:70px;flex:0 0 auto;border-radius:8px;overflow:hidden;background:var(--surface-2)}
  .pthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .champ .name{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:8px 0 2px}
  .champ .role{font-size:13px;color:var(--muted)}
  .champ .metrics{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
  .champ .metrics b{display:block;font-size:19px;font-weight:600}
  .champ .metrics span{font-size:11.5px;color:var(--muted)}
  .spot{padding:20px;display:flex;flex-direction:column}
  .spot .thumb{margin-top:12px;border-radius:10px;overflow:hidden;background:var(--surface-2);
    aspect-ratio:16/10;border:1px solid var(--line);position:relative}
  .spot .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .spot .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .spot .play svg{width:44px;height:44px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
  .spot .cap{margin-top:12px;font-size:13px;color:var(--ink)}
  .spot .stats{margin-top:8px;font-size:12px;color:var(--muted);display:flex;gap:14px}

  /* leaderboard grid */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}
  .board{padding:18px}
  .board h3{margin:0 0 2px;font-size:14.5px;font-weight:600}
  .board .desc{font-size:11.5px;color:var(--muted);margin-bottom:12px}
  ol.rows{list-style:none;margin:0;padding:0}
  ol.rows li{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
  ol.rows li:first-child{border-top:0}
  .rk{flex:0 0 22px;font-weight:700;font-size:13px;color:var(--muted);text-align:center}
  .rk.one{color:var(--coral)}
  .who{flex:1;min-width:0}
  .who .n{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .h{font-size:11px;color:var(--muted)}
  .val{font-weight:600;font-size:13.5px;white-space:nowrap}
  .empty{font-size:12.5px;color:var(--muted);padding:10px 0}

  /* trend */
  .trend{margin-top:16px;padding:18px}
  .trend .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .gain{display:inline-flex;gap:6px;align-items:center;background:#E4F1EA;color:var(--green);
    font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:999px}
  .gain small{color:var(--muted);font-weight:400}

  /* roster */
  .roster{margin-top:28px}
  .roster h2{font-size:16px;font-weight:600;margin:0 0 12px}
  .tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
  .tbl th,.tbl td{padding:11px 14px;text-align:left;font-size:13px;border-top:1px solid var(--line)}
  .tbl th{background:var(--surface-2);font-weight:600;color:var(--muted);font-size:11.5px;
    letter-spacing:.03em;text-transform:uppercase;border-top:0;cursor:pointer;user-select:none}
  .tbl th.num,.tbl td.num{text-align:right}
  .tbl tbody tr{cursor:pointer;transition:background .12s}
  .tbl tbody tr:hover{background:var(--surface-2)}
  .tbl tbody tr:focus-visible{outline:2px solid var(--coral);outline-offset:-2px}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .chip.public{background:#E4F1EA;color:var(--green)}
  .chip.private{background:#F6E3E3;color:var(--crimson)}
  .chip.need{background:#FBF0D9;color:var(--ochre)}
  .muted{color:var(--muted)}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(42,38,34,.32);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,92vw);background:var(--cream);
    box-shadow:-8px 0 32px rgba(42,38,34,.14);transform:translateX(100%);transition:transform .24s ease;
    z-index:41;overflow:auto;padding:24px}
  .drawer.open{transform:none}
  .drawer .x{float:right;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
  .drawer h3{margin:2px 0 0;font-size:20px;font-weight:700}
  .drawer .role{color:var(--muted);font-size:13px;margin-bottom:16px}
  .post{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
  .post:hover .pc{color:var(--coral)}
  .post img{width:56px;height:70px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:var(--surface-2)}
  .post .pc{font-size:12.5px}
  .post .ps{font-size:11.5px;color:var(--muted);margin-top:4px}

  footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted);line-height:1.6}
  footer b{color:var(--ink);font-weight:600}

  @media (max-width:720px){
    .hero{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
    .tbl .hide-sm{display:none}
    .stamp{text-align:left}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l2.6 6.4 6.9.5-5.3 4.5 1.7 6.7L12 16.9 6.1 20.1l1.7-6.7L2.5 8.9l6.9-.5z" fill="#F0653A"/></svg>
      <div>
        <h1>Kirpa Instagram Leaderboard</h1>
        <div class="sub">Live public performance across the Kirpa Army</div>
      </div>
    </div>
    <div class="stamp" id="stamp"></div>
  </div>

  <div class="controls" id="filters" role="group" aria-label="Platform filter"></div>

  <section class="hero">
    <div class="card champ" id="champ"></div>
    <div class="card spot" id="spotlight"></div>
  </section>

  <section class="grid" id="boards"></section>

  <div class="card trend" id="trend"></div>

  <section class="roster">
    <h2>Full roster</h2>
    <table class="tbl" id="tbl">
      <thead><tr>
        <th data-sort="name">Agent</th>
        <th class="num" data-sort="ig">Followers</th>
        <th class="num" data-sort="er">Engagement</th>
        <th class="num hide-sm" data-sort="ppw">Posts/wk</th>
        <th>Status</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>

  <footer id="foot"></footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" tabindex="-1"></aside>

<script>
const SAMPLE_DATA = null; // live-only: no bundled placeholder data

const fmt = n => n==null ? '\u2014'
  : n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M'
  : n>=1000 ? (n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,'')+'k'
  : String(n);
const pct = n => n==null ? '\u2014' : (n*100).toFixed(1)+'%';
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=null;
const IG = () => (DATA.leaderboards && DATA.leaderboards.instagram) || {};
// look up a person's engine-computed metric by name, so the roster never
// re-derives a number the ranking engine already decided (single source of truth)
const lookup = (board, name, key) => { const r=(IG()[board]||[]).find(x=>x.name===name); return r? r[key] : null; };
const firstName = n => (n||'').split(' ')[0];

async function load(){
  try{
    const res = await fetch('data/latest.json',{cache:'no-store'});
    if(!res.ok) throw 0;
    DATA = await res.json();
  }catch(e){ DATA = SAMPLE_DATA; }
  if(!DATA){ renderNoData(); return; }
  if(DATA.meta.source==='pending' || DATA.meta.resolvedProfiles===0){ renderStamp(); renderPending(); return; }
  renderStamp(); renderLegend(); renderAll();
}

function renderNoData(){
  document.querySelector('.hero').outerHTML=
    `<section class="card setup"><div class="eyebrow">No data file</div>
     <h2>Can\u2019t read data/latest.json</h2>
     <p>Open this page over http (<code>python3 -m http.server</code>) or via GitHub Pages, then run the snapshot job.</p></section>`;
  document.getElementById('boards').innerHTML='';
  document.getElementById('trend').style.display='none';
  document.querySelector('.roster').style.display='none';
}
function renderPending(){
  const s=DATA.states||{}, ready=[...new Set((s.awaitingPull||[]).map(r=>r.name))];
  document.querySelector('.hero').outerHTML=
    `<section class="card setup"><div class="eyebrow">No snapshot yet</div>
      <h2>Waiting on the first live pull</h2>
      <p>This board shows live public Instagram data only \u2014 no placeholder numbers until a pull runs.</p>
      <div class="ready"><b>${ready.length} confirmed</b>, ready on the next run${ready.length?': '+ready.map(esc).join(', '):''}.</div></section>`;
  document.getElementById('boards').innerHTML='';
  document.getElementById('trend').style.display='none';
  document.querySelector('.roster').style.display='none';
  renderFoot();
}

function renderStamp(){
  const m=DATA.meta, when=new Date(m.capturedAt);
  const badge = m.source==='live'
    ? '<span class="src live"><span class="dot"></span>Live \u00b7 public data</span>'
    : '<span class="src pending"><span class="dot"></span>Awaiting first pull</span>';
  document.getElementById('stamp').innerHTML =
    badge+'<div style="margin-top:6px">Instagram snapshot '+when.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+
    '<br>'+m.resolvedProfiles+' public profile'+(m.resolvedProfiles===1?'':'s')+' \u00b7 via '+esc(m.provider)+'</div>';
}

// how many people can actually be ranked; a "leaderboard" of one is not a race
function rankableCount(){ return (IG().mostFollowers||[]).length; }
function renderLegend(){
  const el=document.getElementById('filters');
  const n=rankableCount();
  el.innerHTML = `<span class="hint">${n<2
    ? '\u26a0 Ranking activates once a second agent\u2019s handle is confirmed \u2014 showing '+n+' live profile so far.'
    : 'Ranked two ways: <b>followers</b> (reach) and <b>engagement</b> (quality), side by side.'}</span>`;
}

function renderAll(){ renderLeaders(); renderSpotlight(); renderBoards(); renderTrend(); renderRoster(); renderFoot(); }

// HERO LEFT: both ranking bases side by side \u2014 followers leader + engagement leader
function renderLeaders(){
  const c=document.getElementById('champ');
  const fol=(IG().mostFollowers||[])[0];
  const eng=(IG().engagement||[])[0];
  if(!fol && !eng){ c.innerHTML='<div class="eyebrow">Leaders</div><div class="empty">No public profiles yet.</div>'; return; }
  const cell=(label,who,val)=>`<div class="lead"><span class="lead-k">${label}</span>
    <b class="lead-n">${who?esc(firstName(who.name)):'\u2014'}</b>
    <span class="lead-v">${val}</span></div>`;
  c.innerHTML=`<div class="eyebrow">This week\u2019s leaders</div>
    <div class="leads">
      ${cell('Most followers',fol,fol?fmt(fol.followers):'\u2014')}
      ${cell('Highest engagement',eng,eng?pct(eng.engagementRate):'\u2014')}
    </div>
    <div class="lead-note">Two lenses on the same team: audience size vs. how hard that audience reacts.</div>`;
}

// branded placeholder tile when a thumbnail is absent or expired (IG CDN urls rot)
function thumbTile(p, big){
  if(p.thumb) return `<img src="${esc(p.thumb)}" alt="${esc((p.caption||'post').slice(0,60))}" loading="lazy"/>`;
  return `<div class="ph"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="rgba(240,101,58,.10)"/>
    <path d="M10 8.5l6 3.5-6 3.5z" fill="rgba(240,101,58,.85)"/></svg>${big?'<span>reel</span>':''}</div>`;
}

function renderSpotlight(){
  const s=document.getElementById('spotlight');
  const tv=IG().topVideo;
  if(!tv){s.innerHTML='<div class="eyebrow">Top reel</div><div class="empty">No public video data yet.</div>';return;}
  const p=tv.post;
  s.innerHTML=`<div class="eyebrow">Top reel this week</div>
    <a class="thumb" href="${esc(p.url||'#')}" target="_blank" rel="noopener">${thumbTile(p,true)}
      <div class="play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="rgba(240,101,58,.92)"/><path d="M10 8l6 4-6 4z" fill="#fff"/></svg></div></a>
    <div class="cap"><b>${esc(firstName(tv.name))}</b> \u2014 ${esc((p.caption||'').slice(0,80))}</div>
    <div class="stats"><span>\u25b6 ${fmt(p.views)} views</span><span>\u2661 ${fmt(p.likes)}</span><span>\ud83d\udcac ${fmt(p.comments)}</span></div>`;
}

function boardList(title,desc,rows,valFn){
  if(!rows||!rows.length) return `<div class="card board"><h3>${title}</h3><div class="desc">${desc}</div><div class="empty">Nothing to rank yet.</div></div>`;
  const li=rows.slice(0,5).map(r=>`<li><span class="rk${r.rank===1?' one':''}">${r.rank}</span>
    <span class="who"><div class="n">${esc(r.name)}</div>${r.handle?`<div class="h">@${esc(r.handle)}</div>`:''}</span>
    <span class="val">${valFn(r)}</span></li>`).join('');
  return `<div class="card board"><h3>${title}</h3><div class="desc">${desc}</div><ol class="rows">${li}</ol></div>`;
}

function renderBoards(){
  const b=document.getElementById('boards'), B=IG();
  b.innerHTML =
    boardList('Most followers','Reach \u2014 public follower count',B.mostFollowers,r=>fmt(r.followers))+
    boardList('Highest engagement','Quality \u2014 avg likes+comments per post \u00f7 followers',B.engagement,r=>pct(r.engagementRate))+
    boardList('Most active','Consistency \u2014 posts per week',B.postingFrequency,r=>r.postsPerWeek.toFixed(1)+'/wk')+
    mostCommentedCard(B.mostCommented);
}
function mostCommentedCard(mc){
  if(!mc) return `<div class="card board"><h3>Most commented</h3><div class="desc">Conversation \u2014 single most-discussed post</div><div class="empty">Nothing to rank yet.</div></div>`;
  return `<div class="card board"><h3>Most commented post</h3><div class="desc">Conversation \u2014 single most-discussed post</div>
    <ol class="rows"><li><span class="rk one">\ud83d\udcac</span><span class="who"><div class="n">${esc(mc.name)}</div>
    <div class="h">${esc((mc.post.caption||'').slice(0,42))}</div></span><span class="val">${fmt(mc.post.comments)}</span></li></ol></div>`;
}

function renderTrend(){
  const el=document.getElementById('trend'); el.style.display='';
  if(!DATA.meta.trendAvailable||!DATA.trend.length){
    el.innerHTML=`<div class="eyebrow">Follower growth \u00b7 vs last week</div>
      <div class="empty" style="margin-top:8px">Collecting \u2014 the race appears once next week\u2019s snapshot lands and there are two points to compare.</div>`;
    return;
  }
  const rows=DATA.trend.filter(t=>t.platform==='instagram'&&t.followerDelta>0).slice(0,8);
  el.innerHTML=`<div class="eyebrow">Fastest follower growth \u00b7 vs last week</div>
    <div class="chips">${rows.map(t=>`<span class="gain">\u2197 ${esc(firstName(t.name))} +${fmt(t.followerDelta)}${t.followerPct!=null?` <small>${(t.followerPct*100).toFixed(1)}%</small>`:''}</span>`).join('')||'<span class="empty">No gains this week.</span>'}</div>`;
}

// roster identity + state from records; every METRIC pulled from the engine's
// leaderboards, so the table can never disagree with the cards above it
function rosterRows(){
  const people=new Map();
  for(const r of DATA.records){
    if(r.platform!=='instagram') continue;
    if(!people.has(r.name))people.set(r.name,{name:r.name,role:r.role,ig:null,er:null,ppw:null,state:'need',warn:null});
    const p=people.get(r.name);
    if(r.resolved&&!r.isPrivate){
      p.ig=lookup('mostFollowers',r.name,'followers');
      p.er=lookup('engagement',r.name,'engagementRate');
      p.ppw=lookup('postingFrequency',r.name,'postsPerWeek');
      p.state='public';
      if((r.warnings||[]).length) p.warn=r.warnings[0];
    } else if(r.isPrivate){ if(p.state!=='public')p.state='private'; }
  }
  return [...people.values()];
}
let sortKey='ig',sortDir=-1;
function renderRoster(){
  const rows=rosterRows().sort((a,b)=>{
    if(sortKey==='name')return sortDir*a.name.localeCompare(b.name)*-1;
    const va=a[sortKey],vb=b[sortKey];
    return sortDir*(((vb==null)-(va==null))||((va||0)-(vb||0)));
  });
  document.getElementById('tbody').innerHTML=rows.map(p=>`
    <tr tabindex="0" data-name="${esc(p.name)}">
      <td><b>${esc(p.name)}</b><div class="muted" style="font-size:11.5px">${esc(p.role||'')}</div></td>
      <td class="num">${p.ig==null?'<span class="muted">\u2014</span>':fmt(p.ig)}</td>
      <td class="num">${p.er==null?'<span class="muted">\u2014</span>':pct(p.er)}</td>
      <td class="num hide-sm">${p.ppw==null?'<span class="muted">\u2014</span>':p.ppw.toFixed(1)+'/wk'}</td>
      <td>${p.state==='public'?'<span class="chip public">Public</span>':p.state==='private'?'<span class="chip private">Private</span>':'<span class="chip need">Handle needed</span>'}</td>
    </tr>`).join('');
  document.querySelectorAll('#tbody tr').forEach(tr=>{
    const open=()=>openDrawer(tr.dataset.name);
    tr.onclick=open; tr.onkeydown=e=>{if(e.key==='Enter')open();};
  });
  document.querySelectorAll('#tbl th').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;if(k===sortKey)sortDir*=-1;else{sortKey=k;sortDir=-1;}renderRoster();});
}

function openDrawer(name){
  const r=DATA.records.find(x=>x.name===name && x.platform==='instagram');
  const d=document.getElementById('drawer');
  let body='';
  if(!r || !r.resolved) body='<div class="empty">No confirmed public Instagram handle yet. Add one in the registry and it appears here after the next snapshot.</div>';
  else if(r.isPrivate) body='<div class="empty">Private account \u2014 counts only, no post data.</div>';
  else{
    const er=lookup('engagement',name,'engagementRate'), ppw=lookup('postingFrequency',name,'postsPerWeek');
    body+=`<div class="dstat"><div><b>${fmt(r.followers)}</b><span>followers</span></div>
      <div><b>${pct(er)}</b><span>engagement</span></div>
      <div><b>${ppw!=null?ppw.toFixed(1):'\u2014'}</b><span>posts/wk</span></div></div>`;
    if((r.warnings||[]).length) body+=`<div style="font-size:12px;color:var(--ochre);margin-top:8px">${r.warnings.map(esc).join('<br>')}</div>`;
    const top=(r.recentPosts||[]).slice().sort((a,b)=>(b.views||b.likes||0)-(a.views||a.likes||0)).slice(0,3);
    body+='<div class="eyebrow" style="margin-top:18px">Top posts</div>';
    body+=top.map(p=>`<a class="post" href="${esc(p.url||'#')}" target="_blank" rel="noopener"><div class="pthumb">${thumbTile(p)}</div>
      <div><div class="pc">${esc((p.caption||'').slice(0,70))}</div>
      <div class="ps">${p.views!=null?'\u25b6 '+fmt(p.views)+' \u00b7 ':''}\u2661 ${fmt(p.likes)} \u00b7 \ud83d\udcac ${fmt(p.comments)}</div></div></a>`).join('');
  }
  d.innerHTML=`<button class="x" aria-label="Close">\u00d7</button>
    <h3>${esc(name)}</h3><div class="role">${esc((r&&r.role)||'')}</div>${body}`;
  d.querySelector('.x').onclick=closeDrawer;
  d.classList.add('open');d.setAttribute('aria-hidden','false');
  document.getElementById('scrim').classList.add('open');d.focus();
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawer').setAttribute('aria-hidden','true');document.getElementById('scrim').classList.remove('open');}
document.getElementById('scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

function renderFoot(){
  const m=DATA.meta;
  document.getElementById('foot').innerHTML=
    `<b>What this is.</b> Live public Instagram data \u2014 the same profile and post numbers a logged-out visitor sees, read via ${esc(m.provider)} on a weekly snapshot. Not an official Instagram API; a snapshot, not real-time.
    <br><b>How to read it.</b> Follower count rewards reach; engagement rate rewards how hard that audience reacts, so a smaller account can top it. Posts-per-week rewards consistency. Private accounts show as <i>Private</i> and never enter a ranking.
    <br><b>${esc(m.company)}</b> \u00b7 ORN ${esc(m.orn)} \u00b7 ${m.relevantCount} client-facing team members tracked.`;
}

load();
</script>
</body>
