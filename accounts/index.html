<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#f15a29">
  <title>Kirpa Employee Performance Portals</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#171717;--canvas:#f6f3ee;--paper:#fff;--warm:#fbf7f2;--orange:#f15a29;--deep:#b93614;--line:#e8ddd2;--dust:#796f68;--green:#2d8062;--amber:#a86b14;--red:#a94545;--shadow:0 18px 55px rgba(52,35,25,.1);color-scheme:light}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-width:320px;background:radial-gradient(circle at 88% 5%,rgba(241,90,41,.09),transparent 30rem),var(--canvas);color:var(--ink);font:14px/1.55 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}button,input{font:inherit}:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.eyebrow{display:block;color:var(--deep);font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.brand{display:inline-flex;align-items:center;gap:11px;font-size:10px;font-weight:800;letter-spacing:.11em;text-decoration:none;text-transform:uppercase}.brand i{width:10px;height:10px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 5px rgba(241,90,41,.13)}.loading,.fatal{width:min(560px,calc(100% - 36px));margin:18vh auto 0;padding:28px;border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:var(--shadow);text-align:center}.fatal b{display:block;font-size:20px}.fatal p{color:var(--dust)}
    .login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(455px,100%);padding:38px;border:1px solid var(--line);border-radius:24px;background:var(--paper);box-shadow:0 28px 85px rgba(52,35,25,.14)}.login-card .brand{margin-bottom:34px}.login-card h1{margin:6px 0 4px;font:400 clamp(31px,8vw,44px)/1 "DM Serif Display",Georgia,serif;letter-spacing:-.03em}.login-card .role{margin:0;font-weight:700}.login-card>p:not(.role){margin:22px 0;color:var(--dust)}.login-card label{display:block;margin-bottom:8px;font-size:11px;font-weight:800}.login-row{display:flex;gap:9px}.login-row input{min-width:0;flex:1;height:48px;padding:0 14px;border:1px solid #d7ccc2;border-radius:12px;outline:0}.login-row input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(241,90,41,.12)}.login-row button{height:48px;padding:0 19px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer}.login-row button:hover{background:var(--orange);color:var(--ink)}.error{min-height:20px;margin-top:8px;color:var(--red);font-size:11px;font-weight:700}.login-card small{display:block;margin-top:15px;color:var(--dust)}
    .hero{position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;gap:30px;padding:42px max(20px,calc((100% - 1180px)/2));background:var(--orange);border-bottom:5px solid var(--ink)}.hero:after{content:"";position:absolute;width:430px;height:430px;right:-120px;top:-265px;border-radius:50%;background:rgba(255,255,255,.16)}.hero>*{position:relative;z-index:1}.hero .brand{margin-bottom:27px}.hero h1{margin:6px 0;font:400 clamp(34px,5vw,54px)/1 "DM Serif Display",Georgia,serif;letter-spacing:-.03em}.hero p{max-width:730px;margin:0;color:rgba(23,23,23,.72)}.count{text-align:right}.count b{display:block;font-size:47px;line-height:1}.count span{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.main{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:32px 0 70px}.notice{display:flex;justify-content:space-between;gap:25px;margin-bottom:18px;padding:15px 18px;border:1px solid rgba(168,107,20,.28);border-radius:14px;background:rgba(168,107,20,.08)}.notice span{color:var(--dust);text-align:right}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px;border:1px solid var(--line);border-radius:17px;background:var(--paper);box-shadow:0 8px 25px rgba(52,35,25,.06)}.card h2{margin:8px 0 2px;font-size:17px}.card p{margin:0;color:var(--dust);font-size:10px}.status{display:inline-flex;width:fit-content;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--warm);font-size:8px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.status.ready{color:var(--green);border-color:rgba(45,128,98,.3)}.status.pending{color:var(--amber);border-color:rgba(168,107,20,.3)}.access{min-width:188px;text-align:right}.access>span{display:block;margin-bottom:7px;color:var(--dust);font-size:10px}.access a,.access button{display:inline-block;margin-left:4px;padding:8px 10px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:9px;font-weight:800;text-decoration:none;cursor:pointer}.access button{background:var(--warm);color:var(--ink);border:1px solid var(--line)}.access a:hover{background:var(--orange);color:var(--ink)}
    .portal-shell{min-height:100vh}.portal-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px max(16px,calc((100% - 1240px)/2));border-bottom:1px solid var(--line);background:rgba(246,243,238,.94);backdrop-filter:blur(12px)}.portal-person{min-width:0}.portal-person b,.portal-person span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.portal-person b{font-size:13px}.portal-person span{color:var(--dust);font-size:9px}.portal-actions{display:flex;gap:7px}.portal-actions a,.portal-actions button{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font-size:9px;font-weight:800;text-decoration:none;cursor:pointer}.portal-actions button{background:var(--ink);color:#fff}.frame-wrap{width:100%;min-height:calc(100vh - 62px)}.frame-wrap iframe{display:block;width:100%;min-height:calc(100vh - 62px);border:0;background:var(--canvas)}.portal-message{width:min(720px,calc(100% - 36px));margin:70px auto;padding:28px;border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:var(--shadow)}.portal-message h1{margin:6px 0 8px;font:400 36px/1 "DM Serif Display",Georgia,serif}.portal-message p{color:var(--dust)}.footer{display:flex;justify-content:space-between;gap:20px;padding:22px max(20px,calc((100% - 1180px)/2));border-top:1px solid var(--line);background:var(--paper);color:var(--dust);font-size:9px}.footer button{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--warm);font-size:9px;font-weight:800;cursor:pointer}
    @media(max-width:850px){.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.count{text-align:left}}@media(max-width:620px){.login-card{padding:28px 22px}.login-row{flex-direction:column}.login-row button{width:100%}.main{width:calc(100% - 24px)}.card{align-items:flex-start;flex-direction:column}.access{min-width:0;width:100%;text-align:left}.notice{flex-direction:column;gap:5px}.notice span{text-align:left}.portal-top{align-items:flex-start}.portal-actions a{display:none}.footer{flex-direction:column;gap:5px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main id="app"><div class="loading">Preparing Kirpa employee portal…</div></main>
  <script>
  (()=>{'use strict';
    const EMPLOYEES=[
      ['manpreet-kaur','Manpreet Kaur','Manpreet','Founder / CEO','manpreet.kirpa',1],['jai-chatha','Dr. Jai Chatha','Jai','Founder / Managing Director','jai.kirpa',1],['kamalpreet-kaur','Kamalpreet Kaur','Kamalpreet','Team Leader – Sales','kamalpreet.kirpa',1],['saloni-bedi','Saloni Bedi','Saloni','Team Leader – Sales','saloni.kirpa',1],['lipika-madan','Lipika Madan','Lipika','Team Leader – Sales','lipika.kirpa',1],['priyanka-jayanna','Priyanka Jayanna','Priyanka','Team Leader – Sales','priyanka.kirpa',1],['mohammad-mubeen','Mohammad Mubeen','Mohammad','Team Leader – Sales','mubeen.iqbal.kirpa',1],['preety-vijayvargiya','Preety Vijayvargiya','Preety','Senior Consultant – Secondary (Commercial)','preety.kirpa',1],['puja-maheshwari','Puja Maheshwari','Puja','Senior Consultant – Secondary Sales','dxb.pooja.kirpa',1],['vaishali-arora','Vaishali Arora','Vaishali','Consultant – Offplan Sales','vaishali.kirpa',1],['sukhpreet-kaur','Sukhpreet Kaur','Sukhpreet','Consultant – Offplan Sales','sukhpreetbal.kirpa',1],['barkha-kalia','Barkha Kalia','Barkha','Consultant – Offplan Sales','barkha.kirpa',1],['kirti-anil-walke','Kirti Anil Walke','Kirti','Consultant – Offplan Sales','kirti.kirpa',1],['sahil-bedi','Sahil Bedi','Sahil','Consultant – Offplan Sales','sahilbedi.kirpa',1],['riya-bhardwaj','Riya Bhardwaj','Riya','Consultant – Offplan Sales',null,1],['geethika-sri-vyshnavi','Geethika Sri Vyshnavi','Geethika','Consultant – Offplan Sales','geethika.kirpa',1],['kavita-choudhary','Kavita Choudhary','Kavita','Consultant – Secondary Sales','kavita.kirpa.dxb',1],['sarvnihal-singh','Sarvnihal Singh','Sarvnihal','Consultant – Offplan Sales','sarvnihal.kirpa',1],['aasfa-wahab-shaikh','Aasfa Wahab Shaikh','Aasfa','Consultant – Offplan Sales','aasfa.kirpa',1],['jagraaj-singh','Jagraaj Singh','Jagraaj','Consultant – Offplan Sales','jagraaj.kirpa',1],['akshay-rajendra','Akshay Rajendra','Akshay','Consultant – Offplan Sales','akshay.kirpa',1],['kirat-singh-sapra','Kirat Singh Sapra','Kirat','Consultant – Offplan Sales','kirat.kirpa',1],['sara-banu','Sara Banu','Sara','Consultant – Offplan Sales','sarafaisal.kirpa',1],['ritika-kodwani','Ritika Kodwani','Ritika','Consultant – Offplan Sales','ritika.kirpa',1],['jitendra-makhija','Jitendra Makhija','Jitendra','Consultant – Offplan Sales','jeet.kirpa',1],['arbaaz-ali-khan','Arbaaz Ali Khan','Arbaaz','Consultant – Offplan Sales',null,1],['sahil-mendiratta','Sahil Mendiratta','Sahil','Consultant – Offplan Sales','sahil.kirpaa',1],['nikita-lal-tekwani','Nikita Lal Tekwani','Nikita','Consultant – Offplan Sales','nikitaa.kirpa',1],['sleeja-misra','Sleeja Misra','Sleeja','Consultant – Offplan Sales',null,1],['lovepreet-singh','Lovepreet Singh','Lovepreet','Consultant – Offplan Sales','lovepreet.kirpa',1],['mona-shah','Mona Shah','Mona','Consultant – Offplan Sales','mona.kirpa',1],['spoorthi-hassan','Spoorthi Hassan','Spoorthi','Consultant – Offplan Sales','spoorthi.kirpa',1],['faiyaz-mohmedfaruk','Faiyaz Mohmedfaruk','Faiyaz','Consultant – Offplan Sales','faiyaz.kirpa',1],['ameer-agha-shirazi','Ameer Agha Shirazi','Ameer','Consultant – Offplan Sales',null,1],['samaksh-malhotra','Samaksh Malhotra','Samaksh','Consultant – Offplan Sales','samaksh.kirpa',1],['param-singh','Param Singh','Param','Head of Content',null,1],['anmol-singh','Anmol Singh','Anmol','Content Executive',null,1],['amandeep-singh','Amandeep Singh','Amandeep','Content Executive',null,1],['janisha-puri','Janisha Puri','Janisha','HR Executive','janisha.kirpa',0],['inderjeet-kaur','Inderjeet Kaur','Inderjeet','Accountant',null,0],['urvashi-karnani','Urvashi Karnani','Urvashi','Administrator',null,0],['navjot-kaur','Navjot Kaur','Navjot','Operations Coordinator',null,0],['sukhpreet-singh','Sukhpreet Singh','Sukhpreet','Pilot',null,0],['farheen','Farheen','Farheen','Front Desk Executive',null,0]
    ].map(([slug,name,firstName,role,handle,ranked])=>({slug,name,firstName,role,handle,ranked:Boolean(ranked)}));
    const APP=document.getElementById('app'),slug=(new URLSearchParams(location.search).get('person')||'').trim().toLowerCase(),person=EMPLOYEES.find(row=>row.slug===slug)||null,ROOT_HASH='1d8e04f4091afdc613f852472e8a10d69f8f7829e6456111ef45c2b785aa80e2';
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    const key=p=>p?`kirpa-person-${p.slug}-v1`:'kirpa-employee-directory-v1';
    const link=p=>{const u=new URL(location.href);u.search=`?person=${encodeURIComponent(p.slug)}`;u.hash='';return u.href};
    function login(p){const admin=!p;APP.innerHTML=`<section class="login"><div class="login-card"><a class="brand" href="../"><i></i>Kirpa Properties</a><span class="eyebrow">${admin?'Admin directory':'Personal performance portal'}</span><h1>${esc(admin?'Employee portal directory':p.name)}</h1><p class="role">${esc(admin?'Kirpa management access':p.role)}</p><p>${admin?'Enter the Social Ranking admin password to view and copy every employee link.':'Enter your first name to open this personal dashboard view.'}</p><form id="form" autocomplete="off"><label for="password">Password</label><div class="login-row"><input id="password" type="password" required autofocus autocomplete="current-password"><button>Open</button></div><div class="error" id="error" aria-live="polite"></div></form><small>${admin?'Admin password is case-sensitive.':'First-name passwords are not case-sensitive.'}</small></div></section>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();const value=document.getElementById('password').value.trim(),valid=admin?value==='Kirpa':value.toLowerCase()===p.firstName.toLowerCase();if(!valid){document.getElementById('error').textContent=admin?'Incorrect admin password.':'Incorrect password. Use the employee’s first name.';document.getElementById('password').value='';return}sessionStorage.setItem(key(p),'open');admin?directory():portal(p)}}
    function directory(){document.title='Kirpa Employee Performance Portals';APP.innerHTML=`<header class="hero"><div><a class="brand" href="../"><i></i>Kirpa Properties</a><span class="eyebrow">Admin directory</span><h1>Employee performance portals</h1><p>Send each person only their personal link. Their password is their first name.</p></div><div class="count"><b>${EMPLOYEES.length}</b><span>employee links</span></div></header><main class="main"><div class="notice"><b>Interim static access</b><span>The links are functional, but first-name passwords on public GitHub Pages are not strong authentication.</span></div><div class="grid">${EMPLOYEES.map(p=>`<article class="card"><div><span class="status ${p.handle?'ready':'pending'}">${p.handle?'Link ready':'Handle pending'}</span><h2>${esc(p.name)}</h2><p>${esc(p.role)}${p.handle?` · @${esc(p.handle)}`:''}</p></div><div class="access"><span>Password: <b>${esc(p.firstName)}</b></span><a href="${esc(link(p))}">Open →</a><button data-copy="${esc(link(p))}">Copy link</button></div></article>`).join('')}</div></main><footer class="footer"><span><b>Kirpa Properties L.L.C</b> · Employee portal directory</span><button id="lock">Lock directory</button></footer>`;APP.onclick=e=>{const b=e.target.closest('[data-copy]');if(!b)return;navigator.clipboard.writeText(b.dataset.copy).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy link',1200)}).catch(()=>b.textContent='Copy manually')};document.getElementById('lock').onclick=()=>{sessionStorage.removeItem(key(null));location.reload()}}
    function message(p,title,detail){APP.innerHTML=`<div class="portal-shell"><div class="portal-top"><div class="portal-person"><b>${esc(p.name)}</b><span>${esc(p.role)}</span></div><div class="portal-actions"><a href="./">Directory</a><button id="lock">Lock</button></div></div><section class="portal-message"><span class="eyebrow">Personal performance portal</span><h1>${esc(title)}</h1><p>${esc(detail)}</p>${p.handle?`<p><a href="https://www.instagram.com/${encodeURIComponent(p.handle)}/" target="_blank" rel="noopener">Open @${esc(p.handle)} ↗</a></p>`:''}</section></div>`;document.getElementById('lock').onclick=()=>{sessionStorage.removeItem(key(p));sessionStorage.removeItem('kirpa-social-auth-v1');location.reload()}}
    function portal(p){document.title=`${p.name} · Kirpa Social Performance`;if(!p.ranked){message(p,'Role not currently ranked','This role remains in the Kirpa directory but is outside the current social-performance ranking scope.');return}if(!p.handle){message(p,'Account setup pending','A confirmed public Instagram handle is required before personal analytics and recommendations can be measured.');return}sessionStorage.setItem('kirpa-social-auth-v1',ROOT_HASH);APP.innerHTML=`<div class="portal-shell"><div class="portal-top"><div class="portal-person"><b>${esc(p.name)}</b><span>${esc(p.role)} · @${esc(p.handle)}</span></div><div class="portal-actions"><a href="./">Directory</a><button id="lock">Lock</button></div></div><div class="frame-wrap"><iframe id="frame" title="${esc(p.name)} personal analytics" src="../?employeePortal=${encodeURIComponent(p.handle)}"></iframe></div></div>`;document.getElementById('lock').onclick=()=>{sessionStorage.removeItem(key(p));sessionStorage.removeItem('kirpa-social-auth-v1');location.reload()};const frame=document.getElementById('frame');let attempts=0,opened=false;const timer=setInterval(()=>{attempts++;try{const d=frame.contentDocument;if(!d)return;const search=d.getElementById('search');if(search){search.value=p.handle;search.dispatchEvent(new Event('input',{bubbles:true}))}const button=[...d.querySelectorAll('[data-analytics-handle]')].find(item=>String(item.dataset.analyticsHandle||'').toLowerCase()===p.handle.toLowerCase());if(button&&!opened){opened=true;button.click()}const dialog=d.getElementById('analytics-dialog'),content=d.querySelector('#analytics-content .analytics-hero');if(opened&&dialog&&content){if(!d.getElementById('employee-portal-isolation')){const style=d.createElement('style');style.id='employee-portal-isolation';style.textContent='html,body{min-height:100%!important;height:auto!important;overflow:visible!important;background:#f6f3ee!important}body>*{display:none!important}#analytics-dialog{display:block!important;position:static!important;width:100%!important;max-width:none!important;max-height:none!important;margin:0!important;border:0!important;border-radius:0!important;overflow:visible!important;background:#f6f3ee!important;box-shadow:none!important}#analytics-dialog .dialog-shell{max-height:none!important;overflow:visible!important}#analytics-dialog .dialog-close-row{display:none!important}#analytics-dialog::backdrop{display:none!important}';d.head.appendChild(style)}const height=Math.max(900,dialog.scrollHeight+30,d.documentElement.scrollHeight);frame.style.height=`${height}px`;if(attempts>20)clearInterval(timer)}}catch(_){ }if(attempts>120){clearInterval(timer);if(!opened)message(p,'Analytics temporarily unavailable','The current dashboard could not open this employee’s analytics view. The account link is valid; retry after the latest snapshot finishes loading.')}},350)}
    if(slug&&!person){APP.innerHTML='<section class="fatal"><b>Employee link not found</b><p>This URL does not match the current Kirpa roster.</p><a href="./">Open employee directory</a></section>'}else if(sessionStorage.getItem(key(person))==='open'){person?portal(person):directory()}else login(person);
  })();
  </script>
