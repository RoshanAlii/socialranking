<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <script src="../access-gate.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f36f21">
  <meta name="description" content="Visibility OS — visibility-to-revenue intelligence for Kirpa Properties.">
  <title>Visibility OS — Kirpa Properties</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">V</div>
        <div>
          <strong>Visibility OS</strong>
          <span>Revenue intelligence</span>
        </div>
      </div>

      <nav class="nav-list" id="navList">
        <button class="nav-item active" data-view="overview" type="button"><span class="nav-icon">⌂</span><span>Overview</span></button>
        <button class="nav-item" data-view="opportunities" type="button"><span class="nav-icon">✦</span><span>Opportunities</span><span class="nav-count" id="opportunityCount">6</span></button>
        <div class="nav-section">Visibility</div>
        <button class="nav-item" data-view="search" type="button"><span class="nav-icon">⌕</span><span>Search &amp; AI</span></button>
        <button class="nav-item" data-view="social" type="button"><span class="nav-icon">◎</span><span>Social Intelligence</span><span class="live-dot" title="Live data"></span></button>
        <button class="nav-item" data-view="agents" type="button"><span class="nav-icon">◉</span><span>Agents</span></button>
        <button class="nav-item" data-view="projects" type="button"><span class="nav-icon">◇</span><span>Projects &amp; Markets</span></button>
        <button class="nav-item" data-view="competitors" type="button"><span class="nav-icon">◫</span><span>Competitors</span></button>
        <div class="nav-section">Commercial impact</div>
        <button class="nav-item" data-view="revenue" type="button"><span class="nav-icon">↗</span><span>Leads &amp; Revenue</span></button>
        <button class="nav-item" data-view="reputation" type="button"><span class="nav-icon">♡</span><span>Reputation</span></button>
        <div class="nav-section">System</div>
        <button class="nav-item" data-view="health" type="button"><span class="nav-icon">✓</span><span>Data Health</span></button>
        <button class="nav-item" data-view="integrations" type="button"><span class="nav-icon">⌁</span><span>Integrations</span></button>
      </nav>

      <div class="sidebar-footer">
        <div class="workspace-card">
          <div class="workspace-avatar">KP</div>
          <div>
            <strong>Kirpa Properties</strong>
            <span>Design-partner workspace</span>
          </div>
        </div>
        <button class="ghost-button full-width" id="methodologyBtn" type="button">Methodology &amp; confidence</button>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-only" id="menuToggle" type="button" aria-label="Open navigation">☰</button>
          <div>
            <div class="eyebrow">Workspace</div>
            <div class="workspace-title">Kirpa Properties <span class="workspace-pill">UAE</span></div>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="data-status"><span class="status-pulse"></span><span><strong>1 source live</strong><small>Social Ranking</small></span></div>
          <label class="select-wrap"><span class="sr-only">Date range</span><select id="dateRange"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select></label>
          <button class="secondary-button" id="exportBtn" type="button">Export snapshot</button>
          <button class="primary-button" id="askBtn" type="button">Ask Visibility</button>
        </div>
      </header>

      <main id="viewRoot" class="view-root" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header">
        <div>
          <div class="eyebrow" id="modalEyebrow">Visibility OS</div>
          <h2 id="modalTitle">Ask Visibility</h2>
        </div>
        <button class="icon-button" id="modalClose" type="button" aria-label="Close">×</button>
      </header>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
