name: Full account snapshot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - personal-coach.js
      - index.html
      - scripts/employee_portal_quality.py
      - .github/workflows/full-account-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-account-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Apply deterministic visibility migration in the workspace
        run: python scripts/employee_portal_quality.py --fix

      - name: Check personal coach syntax
        run: node --check personal-coach.js

      - name: Verify one authoritative snapshot implementation
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          coach = Path('personal-coach.js').read_text(encoding='utf-8')

          required = '<script src="./personal-coach.js"></script>'
          obsolete = '<script src="./account-coach-snapshot-ui.js"></script>'

          if required not in index:
              raise SystemExit('index.html does not load personal-coach.js')
          if obsolete in index:
              raise SystemExit('obsolete snapshot enhancer is still loaded and can override coach styles')
          if '#kirpa-coach-hero' not in coach or '#kirpa-coach-journey' not in coach:
              raise SystemExit('personal-coach.js does not render the personal snapshot and five-question journey')
          if 'KIRPA_EMPLOYEE_CONTRAST_GUARD_V1' not in coach:
              raise SystemExit('employee portal contrast guard is missing')

          print('Personal snapshot and contrast checks passed.')
