name: Full account snapshot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - personal-coach.js
      - index.html
      - scripts/employee_portal_quality.py
      - .github/workflows/full-account-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-account-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check personal coach syntax
        run: node --check personal-coach.js

      - name: Validate committed portal structure and snapshot accuracy
        run: python scripts/employee_portal_quality.py --check --no-report
