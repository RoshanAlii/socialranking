name: Install employee personal portals

on:
  push:
    branches:
      - feature/employee-personal-links
    paths:
      - .github/workflows/employee-portals.yml
      - src/install-employee-portals-bundle.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: employee-portal-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install employee portal source files
        run: node src/install-employee-portals-bundle.js

      - name: Build and validate employee portals
        run: |
          node src/install-employee-portal-links.js
          node src/build-employee-portals.js
          node test/test_employee_portals.js
          node src/validate-employee-portals.js

      - name: Commit implementation and generated portals
        shell: bash
        run: |
          git config user.name "kirpa-social-bot"
          git config user.email "kirpa-social-bot@users.noreply.github.com"
          git add --all
          git commit -m "feat: add separate encrypted employee portals"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
