name: CRM social results checks
on:
  pull_request:
    paths: ['crm/**', 'server/**', 'db/**', 'drizzle/**', 'test/crm*', 'package*.json', 'vite.config.mjs', 'index.html', 'access-gate.js', '.github/workflows/crm-results.yml']
  push:
    branches: [main]
    paths: ['crm/**', 'server/**', 'db/**', 'drizzle/**', 'test/crm*', 'package*.json', 'vite.config.mjs', 'index.html', 'access-gate.js', '.github/workflows/crm-results.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm run test:crm
      - run: node --check crm/dashboard.js && node --check crm/secure.js
