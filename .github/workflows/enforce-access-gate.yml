name: Enforce dashboard access gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enforce-dashboard-access-gate
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure restricted pages load the access gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [
              (Path('index.html'), './access-gate.js'),
              (Path('visibility/index.html'), '../access-gate.js'),
          ]

          for path, script_src in pages:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              script_tag = f'<script src="{script_src}"></script>'
              robots_tag = '<meta name="robots" content="noindex, nofollow, noarchive">'

              additions = []
              if robots_tag not in text:
                  additions.append(f'  {robots_tag}')
              if script_tag not in text:
                  additions.append(f'  {script_tag}')

              if additions:
                  marker = '<head>'
                  if marker not in text:
                      raise SystemExit(f'{path}: <head> tag not found')
                  text = text.replace(marker, marker + '\n' + '\n'.join(additions), 1)
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Commit protection if a page lost it
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Access gate already enforced."
            exit 0
          fi
          git config user.name "kirpa-social-bot"
          git config user.email "kirpa-social-bot@users.noreply.github.com"
          git add index.html visibility/index.html
          git commit -m "chore: enforce dashboard access gate"
          git push
