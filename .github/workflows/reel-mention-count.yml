name: Daily Reel mention count

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reel-mention-count.yml
      - requirements-mentions.txt
      - src/reel_mentions.py
      - test/test_mentions.py
  schedule:
    # 06:15 Asia/Dubai. Kept away from the 04:00/16:00 UTC leaderboard pulls.
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-reel-mention-count
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-mentions.txt

      - name: Restore multilingual speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-faster-whisper-small-v1

      - name: Install local transcription dependencies
        run: python -m pip install --requirement requirements-mentions.txt

      - name: Verify mention-count rules
        run: python -m unittest discover -s test -p "test_mentions.py"

      - name: Collect and transcribe the 30-day DAMAC Reel window
        env:
          APIFY_TOKEN_MENTION_COUNT: ${{ secrets.APIFY_TOKEN_MENTION_COUNT }}
          INSTAGRAM_ACCOUNT: kirpa.properties
          MENTION_TARGET: DAMAC
          MENTION_WINDOW_DAYS: 30
          WHISPER_MODEL: small
        run: python src/reel_mentions.py

      - name: Validate published JSON
        run: python -m json.tool data/reel-mentions.json > /dev/null

      - name: Commit refreshed count and cache
        run: |
          git config user.name "kirpa-mention-bot"
          git config user.email "kirpa-mention-bot@users.noreply.github.com"
          git add -- data/reel-mentions.json data/reel-mention-cache.json
          if git diff --cached --quiet; then
            echo "No Reel mention changes to commit."
          else
            git commit -m "data: refresh 30-day DAMAC Reel mentions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Announce failed mention refresh
        if: failure()
        run: echo "::error title=Reel mention refresh failed::Open this workflow run and inspect the first failed step."
