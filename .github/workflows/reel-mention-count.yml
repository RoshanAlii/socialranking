name: Fortnightly developer intelligence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reel-mention-count.yml
      - developer-dictionary.json
      - handles.json
      - requirements-mentions.txt
      - src/developer_intelligence.py
      - src/reel_mentions.py
      - test/test_mentions.py
  schedule:
    # A cheap due check runs daily; the paid collection/transcription path runs
    # only when the last successful report is at least 14 days old.
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fortnightly-developer-intelligence
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check whether the 14-day analysis is due
        id: due
        run: python src/developer_intelligence.py --check-due

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.due.outputs.due == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-mentions.txt

      - name: Restore multilingual speech model
        if: github.event_name == 'workflow_dispatch' || steps.due.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-faster-whisper-small-v1

      - name: Install local transcription dependencies
        if: github.event_name == 'workflow_dispatch' || steps.due.outputs.due == 'true'
        run: python -m pip install --requirement requirements-mentions.txt

      - name: Verify mention-count rules
        if: github.event_name == 'workflow_dispatch' || steps.due.outputs.due == 'true'
        run: python -m unittest discover -s test -p "test_mentions.py"

      - name: Collect once, transcribe once, and match all configured developers
        if: github.event_name == 'workflow_dispatch' || steps.due.outputs.due == 'true'
        env:
          APIFY_TOKEN_MENTION_COUNT: ${{ secrets.APIFY_TOKEN_MENTION_COUNT }}
          WHISPER_MODEL: small
        run: python src/developer_intelligence.py

      - name: Validate published JSON
        if: github.event_name == 'workflow_dispatch' || steps.due.outputs.due == 'true'
        run: |
          python -m json.tool data/developer-intelligence.json > /dev/null
          python -m json.tool data/developer-intelligence-cache.json > /dev/null
          python -m json.tool data/developer-intelligence-status.json > /dev/null

      - name: Commit refreshed intelligence and cache
        if: github.event_name == 'workflow_dispatch' || steps.due.outputs.due == 'true'
        run: |
          git config user.name "kirpa-mention-bot"
          git config user.email "kirpa-mention-bot@users.noreply.github.com"
          git add -- data/developer-intelligence.json data/developer-intelligence-cache.json data/developer-intelligence-status.json
          if git diff --cached --quiet; then
            echo "No developer intelligence changes to commit."
          else
            git commit -m "data: refresh developer intelligence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Announce failed mention refresh
        if: failure()
        run: echo "::error title=Reel mention refresh failed::Open this workflow run and inspect the first failed step."
