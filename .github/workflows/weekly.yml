name: Four-day social snapshot

on:
  schedule:
    # Check at 08:00 and 20:00 Asia/Dubai. These checks do not call Apify; the
    # paid path runs only when the last validated capture is 96 hours old.
    - cron: "0 4,16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/refresh-now]

permissions:
  contents: write

concurrency:
  group: four-day-social-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check whether the four-day refresh is due
        id: due
        run: node src/refresh-due.js

      - name: Verify formulas and release guards
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.due.outputs.due == 'true'
        run: node test/test.js

      - name: Verify roster integrity
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.due.outputs.due == 'true'
        run: node src/roster.js verify

      - name: Pull public Instagram profiles and complete post windows
        id: ingest
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.due.outputs.due == 'true'
        env:
          # The mention token is the active Kirpa Apify account; keep the legacy
          # token as a fallback while repositories rotate secrets.
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN_MENTION_COUNT || secrets.APIFY_TOKEN }}
          # Starter includes $29 of monthly platform usage. Warn at 80% so a
          # normal refresh can finish without silently consuming the reserve.
          APIFY_MONTHLY_SOFT_LIMIT_USD: "23.20"
          APIFY_PLAN_LIMIT_USD: "29.00"
        run: node src/ingest.js

      - name: Quarantine candidate snapshot and raw captures
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-candidate-${{ github.run_id }}
          path: |
            data/latest.json
            data/raw
          retention-days: 7

      - name: Validate and stamp every published answer
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.due.outputs.due == 'true') && steps.ingest.outputs.published == 'true'
        run: node src/validate-snapshot.js --stamp

      - name: Re-run tests against the release candidate
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.due.outputs.due == 'true'
        run: node test/test.js

      - name: Commit validated snapshot, history, cache telemetry, and refresh state
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.due.outputs.due == 'true'
        run: |
          git config user.name "kirpa-social-bot"
          git config user.email "kirpa-social-bot@users.noreply.github.com"
          git add -- data/latest.json data/history data/series.json data/apify-usage.json data/refresh-status.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "data: refresh validated Instagram snapshot"
            # Raw captures are retained in the workflow artifact, not repository
            # history. Restore them before rebasing so an expected audit-only
            # change cannot block publication of the validated data/status.
            git restore --source=HEAD --worktree -- data/raw
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Announce failed refresh
        if: failure() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.due.outputs.due == 'true')
        run: echo "::error title=Social snapshot refresh failed::Open this workflow run and inspect the first failed step."
